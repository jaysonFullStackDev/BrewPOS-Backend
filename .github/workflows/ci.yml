name: Backend CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18, 20]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      # Check all modules load without errors
      - name: Validate modules
        run: node -e "require('./routes/index'); require('./middleware/auth'); require('./middleware/validate'); require('./middleware/rateLimiter'); require('./middleware/auditLog'); console.log('All modules OK');"
        env:
          JWT_SECRET: ci-test-secret
          JWT_REFRESH_SECRET: ci-test-refresh

      # Check server boots without crashing (give it 3s then kill)
      - name: Validate server startup
        run: |
          timeout 3 node server.js || true
          echo "Server startup OK"
        env:
          PORT: 4000
          JWT_SECRET: ci-test-secret
          JWT_REFRESH_SECRET: ci-test-refresh
          DB_HOST: ""

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Render
        if: ${{ secrets.RENDER_DEPLOY_HOOK_URL != '' }}
        run: curl -s "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
