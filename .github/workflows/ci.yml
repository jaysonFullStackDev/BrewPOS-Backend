name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18, 20]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - run: node -e "require('./server.js')" &
        env:
          PORT: 4000
          DATABASE_URL: ""
          JWT_SECRET: ci-test-secret
          JWT_REFRESH_SECRET: ci-test-refresh
